services:
  mysql:
    image: elisasc/clima-db
    container_name: clima_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-parde4}
      MYSQL_DATABASE: clima_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    image: patracamiguel/clima-api:latest
    container_name: clima_app

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clima_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-parde4}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-aaa1b2d610dbc18cbacdf4c32273c324}

volumes:
  mysql_data:
