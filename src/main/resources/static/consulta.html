<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de clima - Clima API</title>
    <link rel="stylesheet" href="/styles/app.css?v=6">
</head>
<body>
    <main id="dashboard" class="dashboard">
        <section id="search-view" class="search-view" aria-live="polite">
            <button id="logout-button" class="logout-button" type="button">Cerrar sesion</button>
            <h1>Clima API</h1>

            <form id="weather-form" class="search-form">
                <label for="city-input">Buscar ciudad</label>
                <div class="search-row">
                    <input id="city-input" name="ciudad" type="search" placeholder="Ej. Coatzacoalcos" autocomplete="off" required>
                    <button type="submit">Buscar</button>
                </div>
            </form>

            <nav class="category-bar" aria-label="Categorias">
                <button class="category-button" type="button" onclick="location.href='/historial.html'">Historial</button>
                <button class="category-button" type="button" onclick="location.href='/favoritos.html'">Favoritos</button>
                <button id="profile-button" class="category-button" type="button">Usuario</button>
            </nav>

            <p id="dashboard-message" class="message dashboard-message"></p>
        </section>

        <section id="result-view" class="result-view hidden" aria-live="polite">
            <button id="back-button" class="back-button" type="button">Volver al buscador</button>

            <article class="result-panel">
                <p class="panel-label">Consulta</p>
                <h2 id="current-city">Busca una ciudad</h2>
                <div class="temperature-row">
                    <strong id="current-temp">--</strong>
                    <span id="current-description">Sin datos cargados.</span>
                </div>
                <dl class="metrics">
                    <div>
                        <dt>Sensacion</dt>
                        <dd id="feels-like">--</dd>
                    </div>
                    <div>
                        <dt>Estado</dt>
                        <dd id="weather-main">--</dd>
                    </div>
                </dl>
                <div id="favorite-action" class="favorite-action">
                    <button id="favorite-button" class="favorite-button" type="button">Guardar en favoritos</button>
                </div>
            </article>

            <article class="result-panel">
                <p class="panel-label">Pronostico</p>
                <h2>Proximas horas</h2>
                <div id="forecast-list" class="forecast-list empty-state">Busca una ciudad para ver el pronostico.</div>
            </article>

            <article class="result-panel recommendation-panel">
                <p class="panel-label">Recomendaciones</p>
                <h2>Que usar hoy</h2>
                <p id="clothing-recommendation">Consulta una ciudad para recibir una recomendacion de ropa.</p>
                <p id="accessory-recommendation" class="muted"></p>
                <p id="weather-advice" class="advice"></p>
            </article>
        </section>
    </main>

    <script src="/scripts/consulta.js?v=1"></script>
</body>
</html>
