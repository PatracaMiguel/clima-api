<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Favoritos - Clima API</title>
    <link rel="stylesheet" href="/styles/app.css">
    <style>
        body { background: #edf4f2; margin: 0; min-height: 100vh; font-family: inherit; color: inherit; }
        .topbar {
            background: #0284C7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            box-shadow: 0 2px 6px rgba(23,49,61,0.12);
        }
        .brand { color: #fff; font-weight: 800; letter-spacing: 0; text-transform: uppercase; font-size: 18px; }
        .topbar .back-button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.16);
            color: #ffffff;
            min-width: 140px;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 48px 16px;
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 960px;
            background: #ffffff;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 18px 50px rgba(23, 49, 61, 0.08);
        }

        .header-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom: 18px;
        }

        .header-row h2 { margin:0; font-size:20px; color:#17313d; }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
            gap: 12px;
        }

        .fav-item {
            padding: 14px;
            border-radius: 8px;
            background: #f8fbfb;
            border: 1px solid #d7e6e4;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: space-between;
        }

        .fav-title { font-weight:800; color:#17313d; font-size:16px; margin:0; }
        .fav-sub { color:#60717a; font-size:13px; margin:0; }

        .fav-actions { display:flex; gap:8px; }
        .fav-actions button { flex:1; min-height:40px; border-radius:6px; }

        .message { margin-top: 10px; min-height: 20px; }

        .empty { text-align:center; color:#60717a; padding:1px; }

        @media (max-width:520px) {
            .card { padding: 16px; }
        }
    </style>
</head>
<body>
    <header class="topbar" role="banner">
        <div class="brand">Clima API</div>
        <div>
            <button id="back-button" class="back-button" type="button">Volver a buscador</button>
        </div>
    </header>

    <main class="container" role="main">
        <section class="card" aria-live="polite">
            <div class="header-row">
                <h2>Tus ciudades favoritas</h2>
                <div id="actions-right"></div>
            </div>

            <div id="favorites-container">
                <p id="favorites-message" class="message"></p>
                <div id="favorites-grid" class="favorites-grid"></div>
            </div>
        </section>
    </main>

    <script>
    (function () {
        function readJson(response) {
            return response.text().then((text) => {
                if (!text) return {};
                try { return JSON.parse(text); } catch (e) { return { mensaje: text }; }
            });
        }

        function errorMessage(body) {
            if (!body) return "Ocurrio un error.";
            if (body.mensaje) return body.mensaje;
            if (body.mensajes) return Object.values(body.mensajes).join(" ");
            return "Ocurrio un error.";
        }

        function setMessage(el, text, type) {
            el.textContent = text;
            el.classList.remove("success", "error");
            if (type) el.classList.add(type);
        }

        async function requestJson(url, options = {}) {
            try {
                const response = await fetch(url, {
                    method: options.method || "GET",
                    headers: options.body ? { "Content-Type": "application/json" } : {},
                    credentials: "same-origin",
                    body: options.body ? JSON.stringify(options.body) : undefined
                });

                const data = await readJson(response);

                if (!response.ok) {
                    if (String(data.mensaje || "").toLowerCase().includes("iniciar sesion")) {
                        sessionStorage.removeItem("usuario");
                        window.location.href = "/index.html";
                        return { ok: false, data, message: errorMessage(data) };
                    }
                    return { ok: false, data, message: errorMessage(data) };
                }

                return { ok: true, data, message: "" };
            } catch (e) {
                return { ok: false, data: {}, message: "No se pudo conectar con la API." };
            }
        }

        const backBtn = document.querySelector("#back-button");
        backBtn.addEventListener("click", () => {
            window.location.href = "/index.html";
        });

        const msgEl = document.querySelector("#favorites-message");
        const gridEl = document.querySelector("#favorites-grid");

        function getSessionUser() {
            try {
                const raw = localStorage.getItem("climaUsuario");
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        async function loadFavorites() {
            setMessage(msgEl, "Cargando favoritos...", "");
            gridEl.innerHTML = "";

            const sessionUser = getSessionUser();
            if (!sessionUser) {
                 // no hay sesión -> redirect to login
                 window.location.href = "/index.html";
                 return;
             }

            const userId = sessionUser.idUsuario ?? sessionUser.id ?? sessionUser.usuario?.idUsuario ?? null;
            if (!userId) {
                window.location.href = "/index.html";
                return;
            }

            const res = await requestJson(`/favoritos`);
            if (!res.ok) {
                setMessage(msgEl, res.message || "No se pudieron cargar los favoritos.", "error");
                return;
            }

            const list = Array.isArray(res.data) ? res.data : [];
            if (!list.length) {
                gridEl.innerHTML = '<div class="empty">No tienes ciudades favoritas aún</div>';
                setMessage(msgEl, "", "");
                return;
            }

            setMessage(msgEl, "", "");
            gridEl.innerHTML = list.map((fav) => {
                const id = fav.id ?? fav.idFavorito ?? "";
                const ciudad = fav.ciudad ?? fav.nombre ?? fav.ciudadNombre ?? "";
                const pais = fav.pais ?? fav.paisNombre ?? fav.country ?? "";
                return `
                    <div class="fav-item" data-id="${escapeHtml(id)}" data-ciudad="${escapeHtml(ciudad)}">
                        <div>
                            <p class="fav-title">${escapeHtml(ciudad)}</p>
                            <p class="fav-sub">${escapeHtml(pais)}</p>
                        </div>
                        <div class="fav-actions">
                            <button class="view-btn" type="button">Ver clima</button>
                            <button class="del-btn link-button" type="button">Eliminar</button>
                        </div>
                    </div>
                `;
            }).join("");

            // attach handlers
            gridEl.querySelectorAll(".view-btn").forEach((btn) => {
                btn.addEventListener("click", (ev) => {
                    const card = ev.target.closest(".fav-item");
                    const ciudad = card.getAttribute("data-ciudad") || "";
                    if (ciudad) {
                        window.location.href = `/principal.html?ciudad=${encodeURIComponent(ciudad)}`;
                    }
                });
            });

            gridEl.querySelectorAll(".del-btn").forEach((btn) => {
                btn.addEventListener("click", async (ev) => {
                    const card = ev.target.closest(".fav-item");
                    const id = card.getAttribute("data-id");
                    if (!id) return;
                    btn.disabled = true;
                    const r = await requestJson(`/favoritos/${encodeURIComponent(id)}`, { method: "DELETE" });
                    btn.disabled = false;
                    if (!r.ok) {
                        setMessage(msgEl, r.message || "No se pudo eliminar el favorito.", "error");
                        return;
                    }
                    await loadFavorites();
                });
            });
        }

        // simple escape to avoid injecting HTML from server
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // init
        document.addEventListener("DOMContentLoaded", loadFavorites);
    })();
    </script>
</body>
</html>
