spring:
  application:
    name: clima-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/clima_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:parde4}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

openweathermap:
  api-url: ${OPENWEATHERMAP_API_URL:https://api.openweathermap.org/data/2.5}
  api-key: ${WEATHER_API_KEY:aaa1b2d610dbc18cbacdf4c32273c324}
